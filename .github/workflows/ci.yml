name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DepthCharts.slnx

      - name: Build
        run: dotnet build DepthCharts.slnx --no-restore --configuration Release --warnaserror

      - name: Verify formatting
        run: dotnet format DepthCharts.slnx --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test tests/DepthCharts.Unit.Tests/DepthCharts.Unit.Tests.csproj --configuration Release --no-build --no-restore

      - name: Integration tests
        run: dotnet test tests/DepthCharts.Integration.Tests/DepthCharts.Integration.Tests.csproj --configuration Release --no-build --no-restore
